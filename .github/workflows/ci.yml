name: CI

on:
  release:
    types: [ published ]
  push:
    branches:
      - main
      - dev
  pull_request:
  schedule:
    - cron: '0 22 * * *'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Ruff lint
        run: uv run --extra dev ruff check
      - name: Ruff format check
        run: uv run --extra dev ruff format --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: ty
        run: uv run --extra dev ty check

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.12', '3.13', '3.14' ]
        os: [ 'ubuntu-latest' ]
        include:
          - python-version: '3.12'
            os: 'macos-latest'
          - python-version: '3.12'
            os: 'windows-latest'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests with coverage
        run: uv run --extra dev coverage run --source=courtside_data --module pytest --ignore=tests/e2e
      - name: Coverage report
        run: uv run --extra dev coverage xml
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    runs-on: ubuntu-latest
    # Live requests to basketball-reference.com; only on the nightly schedule
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: End-to-end tests
        run: bash ./scripts/e2e_tests.sh "$(pwd)/dependencies"

  documentation:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [ lint, typecheck, test ]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Set Git Configuration
        run: |
          REMOTE="https://${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git config --global user.name "${GH_NAME}"
          git config --global user.email "${GH_EMAIL}"
          git remote set-url origin ${REMOTE}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_NAME: ${{ secrets.GH_NAME }}
          GH_EMAIL: ${{ secrets.GH_EMAIL }}
      - name: Publish Documentation
        run: uv run --extra dev mkdocs gh-deploy --force
