name: CI

on:
  release:
    types: [ published ]
  push:
    branches:
      - main
      - dev
  pull_request:
  schedule:
    - cron: '0 22 * * *'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Ruff lint
        run: uv run ruff check
      - name: Ruff format check
        run: uv run ruff format --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: ty
        run: uv run ty check

  api-codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      - name: Start API server
        run: |
          uv run courtside-data serve &
          echo $! > server.pid
      - name: Wait for OpenAPI schema
        working-directory: ui
        run: npx --yes wait-on http://127.0.0.1:8765/openapi.json --timeout 30000
      - name: Generate API types
        working-directory: ui
        run: npm run gen:api
      - name: Verify generated API types are committed
        run: |
          if ! git diff --exit-code ui/src/lib/openapi-types.ts; then
            echo "::error::ui/src/lib/openapi-types.ts is out of date. Run 'npm run gen:api' from ui/ and commit it."
            exit 1
          fi
      - name: Stop API server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.12', '3.13', '3.14' ]
        os: [ 'ubuntu-latest' ]
        include:
          - python-version: '3.12'
            os: 'macos-latest'
          - python-version: '3.12'
            os: 'windows-latest'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests with coverage
        run: uv run coverage run --source=courtside_data --module pytest
      - name: Coverage report
        run: uv run coverage xml
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  documentation:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [ lint, typecheck, test ]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Set Git Configuration
        run: |
          REMOTE="https://${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git config --global user.name "${GH_NAME}"
          git config --global user.email "${GH_EMAIL}"
          git remote set-url origin ${REMOTE}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_NAME: ${{ secrets.GH_NAME }}
          GH_EMAIL: ${{ secrets.GH_EMAIL }}
      - name: Publish Documentation
        run: uv run mkdocs gh-deploy --force
