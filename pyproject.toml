[project]
name = "courtside-data"
version = "5.0.0a1"
description = "A comprehensive Basketball Reference scraping library with 50+ endpoints, typed models, and built-in caching"
readme = "README.md"
license = "MIT"
keywords = ["NBA", "Basketball", "Reference", "basketball-reference.com", "sports-data", "scraping"]
authors = [
    {name = "Nicolas Alexander", email = "nick.isaiah.alexander@gmail.com"},
]
maintainers = [
    {name = "Nicolas Alexander", email = "nick.isaiah.alexander@gmail.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "httpx-curl-cffi>=0.1.0",
    "hishel>=1.1.0",
    "stamina>=24.3.0",
    "lxml>=5.1.0",
    "parsel>=1.8.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
pandas = [
    "pandas>=2.0",
]
dev = [
    "pandas>=2.0",
    "pytest>=8.0",
    "pytest-socket>=0.7.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.6.0",
    "pytest-randomly>=3.15",
    "pytest-cov>=6.0",
    "respx>=0.22.0",
    "deepdiff>=8.0",
    "selectolax>=0.3",
    "coverage>=7.0",
    "covdefaults>=2.3",
    "diff-cover>=9.0",
    "ruff>=0.11.0",
    "ty>=0.0.1a14",
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.0",
    "pymdown-extensions>=10.0",
]

[project.scripts]
courtside-data = "courtside_data.cli:main"

[project.urls]
Repository = "https://github.com/nickth3man/courtside-data"
Homepage = "https://github.com/nickth3man/courtside-data"
Issues = "https://github.com/nickth3man/courtside-data/issues"
Pull-requests = "https://github.com/nickth3man/courtside-data/pull_requests"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["courtside_data"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = "tests"
# --timeout=300: backstop so no single test can hang indefinitely.
# pytest-xdist is installed but intentionally NOT enabled by default here.
# Run the offline suite in parallel on demand, e.g.
#   uv run pytest tests -n auto
# Do NOT add -n to addopts: the CI coverage job runs `coverage run -m pytest`
# and would not measure xdist worker subprocesses, collapsing coverage.
addopts = ["--disable-socket", "--timeout=300"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "PT",    # flake8-pytest-style
    "ASYNC", # flake8-async
]

[tool.ruff.lint.per-file-ignores]
# Embedded HTML fixtures carry long lines and significant trailing whitespace
"tests/**" = ["E501", "W291", "S101", "B011"]
"scripts/**" = ["E501"]

[tool.coverage.run]
plugins = ["covdefaults"]
relative_files = true
source = ["courtside_data"]
omit = ["*/__init__.py", "tests/*", "*/conftest.py", "courtside_data/legacy/*"]
branch = true

[tool.ty.environment]
python-version = "3.12"
extra-paths = ["courtside_data"]

[tool.ty.src]
exclude = [".venv", "dist", ".slim"]
