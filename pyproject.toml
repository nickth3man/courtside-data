[project]
name = "courtside-data"
version = "5.0.0a1"
description = "A comprehensive Basketball Reference scraping library with 50+ endpoints, typed models, and built-in caching"
readme = "README.md"
license = "MIT"
keywords = ["NBA", "Basketball", "Reference", "basketball-reference.com", "sports-data", "scraping"]
authors = [
    {name = "Nicolas Alexander", email = "nick.isaiah.alexander@gmail.com"},
]
maintainers = [
    {name = "Nicolas Alexander", email = "nick.isaiah.alexander@gmail.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = [
    "lxml>=5.1.0",
    "parsel>=1.8.0",
    "pytz>=2024.1",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-freezer>=0.4.2",
    "pytest-socket>=0.7.0",
    "requests-mock>=1.12.1",
    "coverage>=7.0",
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.0",
    "pymdown-extensions>=10.0",
    "codecov>=2.1.13",
]

[project.urls]
Repository = "https://github.com/nickth3man/courtside-data"
Homepage = "https://github.com/nickth3man/courtside-data"
Issues = "https://github.com/nickth3man/courtside-data/issues"
Pull-requests = "https://github.com/nickth3man/courtside-data/pull_requests"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["basketball_reference_web_scraper"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = "tests"
addopts = ["-p", "no:freezegun", "--disable-socket"]
