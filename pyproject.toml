[project]
name = "courtside-data"
version = "5.0.0a1"
description = "A comprehensive Basketball Reference scraping library with 50+ endpoints, typed models, and built-in caching"
readme = "README.md"
license = "MIT"
keywords = ["NBA", "Basketball", "Reference", "basketball-reference.com", "sports-data", "scraping"]
authors = [
    {name = "Nicolas Alexander", email = "nick.isaiah.alexander@gmail.com"},
]
maintainers = [
    {name = "Nicolas Alexander", email = "nick.isaiah.alexander@gmail.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "httpx-curl-cffi>=0.1.0",
    "curl-cffi>=0.7.0",
    "hishel>=1.1.0",
    "stamina>=26.1.0",
    "lxml>=5.1.0",
    "parsel>=1.8.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
    "pydantic>=2.13.4",
    "pydantic-core>=2.14.0",
    "platformdirs",
    "cachetools",
    "orjson",
    "selectolax>=0.3",
    "rich>=13.0",
    "dateparser",
]

[project.optional-dependencies]
pandas = [
    "pandas>=2.0",
]

[dependency-groups]
dev = [
    # runtime extras mirrored for tests
    "pandas>=2.0",
    # test framework
    "pytest>=8.0",
    "pytest-socket>=0.7.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.6.0",
    "pytest-randomly>=3.15",
    "pytest-cov>=6.0",
    "respx>=0.22.0",
    "deepdiff>=8.0",
    # coverage / diff
    "coverage>=7.0",
    "covdefaults>=2.3",
    "diff-cover>=9.0",
    # lint / format / safe refactoring
    "ruff>=0.11.0",
    "flynt>=1.0.6",
    # dead-code / dependency / security analysis
    "vulture>=2.16",
    "deptry>=0.25",
    "bandit>=1.7",
    # type checker
    "ty>=0.0.1a14",
    # custom structural codemods
    "libcst>=1.0",
    # task runner
    "taskipy>=1.13",
    # benchmarking / profiling
    "pytest-benchmark",
    "pyinstrument",
    # docs
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.0",
    "pymdown-extensions>=10.0",
    "mkdocstrings[python]",
    "griffe-pydantic",
]

[project.scripts]
courtside-data = "courtside_data.cli:main"

[project.urls]
Repository = "https://github.com/nickth3man/courtside-data"
Homepage = "https://github.com/nickth3man/courtside-data"
Issues = "https://github.com/nickth3man/courtside-data/issues"
Pull-requests = "https://github.com/nickth3man/courtside-data/pull_requests"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["courtside_data"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = "tests"
# --timeout=300: backstop so no single test can hang indefinitely.
# pytest-xdist is installed but intentionally NOT enabled by default here.
# Run the offline suite in parallel on demand, e.g.
#   uv run pytest tests -n auto
# Do NOT add -n to addopts: the CI coverage job runs `coverage run -m pytest`
# and would not measure xdist worker subprocesses, collapsing coverage.
addopts = ["--disable-socket", "--timeout=300"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["courtside_data"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "PT",    # flake8-pytest-style
    "ASYNC", # flake8-async

    # --- safe refactoring / cleanup ---
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify (nested ifs, redundant booleans, etc.)
    "PIE",   # flake8-pie (useless pass, range start, etc.)
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "ISC",   # implicit string concatenation
    "FLY",   # flynt-style f-string conversion
    "FURB",  # refurb idiomatic rewrites
    "RUF",   # ruff-specific
    "ERA",   # eradicate commented-out code
]

fixable = ["ALL"]
unfixable = [
    "F401",   # unused imports — keep for explicit cleanup
    "F841",   # unused variables — keep for explicit cleanup
    "ERA001", # commented-out code — review manually
    "PIE804", # dict(**kwargs) → dict(kwargs) can break APIs
]

[tool.ruff.lint.per-file-ignores]
# Embedded HTML fixtures carry long lines and significant trailing whitespace
"tests/**" = ["E501", "W291", "S101", "B011"]
"scripts/**" = ["E501"]

[tool.coverage.run]
plugins = ["covdefaults"]
relative_files = true
source = ["courtside_data"]
omit = ["*/__init__.py", "tests/*", "*/conftest.py"]
branch = true

[tool.ty.environment]
python-version = "3.12"
extra-paths = ["courtside_data"]

[tool.ty.src]
exclude = [".venv", "dist", ".slim"]

[tool.deptry.per_rule_ignores]
# DEP002: tzdata is required on Windows for timezone support and is not directly imported.
# DEP002: pydantic-core backs InitErrorDetails used in ValidationError construction (TYPE_CHECKING import).
DEP002 = ["tzdata", "pydantic-core"]

[tool.vulture]
min_confidence = 80
ignore_names = ["InitErrorDetails"]

[tool.taskipy.tasks]
fix      = "ruff check --fix . && ruff format ."
lint     = "ruff check ."
format   = "ruff format --check ."
type     = "ty check"
test     = "pytest tests -n auto"
test-cov = "coverage run --source=courtside_data --module pytest tests"
audit    = "ruff check . && ruff format --check . && ty check && pytest tests -n auto"
refactor = "ruff check --fix . && ruff format . && flynt -tc -tj courtside_data/ tests/ scripts/"
vulture  = "vulture courtside_data --min-confidence 80"
deptry   = "deptry ."
bandit   = "bandit -r courtside_data -lll"
