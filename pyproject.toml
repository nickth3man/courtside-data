[project]
name = "basketball_reference_web_scraper"
version = "4.15.4"
description = "A Basketball Reference client that generates data by scraping the website"
readme = "README.md"
license = "MIT"
keywords = ["NBA", "Basketball", "Reference", "basketball-reference.com"]
authors = [{name = "Jae Bradley", email = "jae.b.bradley@gmail.com"}]
maintainers = [{name = "Jae Bradley", email = "jae.b.bradley@gmail.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = [
    "lxml>=5.1.0",
    "pytz>=2024.1",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-freezer>=0.4.2",
    "requests-mock>=1.12.1",
    "coverage>=7.0",
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.0",
    "pymdown-extensions>=10.0",
    "codecov>=2.1.13",
]

[project.urls]
Repository = "https://github.com/jaebradley/basketball_reference_web_scraper"
Homepage = "https://jaebradley.github.io/basketball_reference_web_scraper"
Issues = "https://github.com/jaebradley/basketball_reference_web_scraper/issues"
Pull-requests = "https://github.com/jaebradley/basketball_reference_web_scraper/pull_requests"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["basketball_reference_web_scraper"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = "tests"
addopts = ["-p", "no:freezegun"]
